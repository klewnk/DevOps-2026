server {
    listen 80;
    server_name klewn-devops.duckdns.org;
    return 301 https://$host$request_uri; # Redirect σε HTTPS
}

server {
    listen 443 ssl;
    server_name klewn-devops.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/klewn-devops.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klewn-devops.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://spring_app_container:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

   location /mail/ {
    # Χρησιμοποιούμε το όνομα του container από το docker-compose
    proxy_pass http://mailhog:8025/; 
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
   }

   location /db/ {
    proxy_pass http://adminer:8080/;
    
    # Αυτές οι γραμμές λύνουν το 403 Forbidden
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Πολύ σημαντικό για τα session cookies
    proxy_cookie_path / /db/;
    
    # Απενεργοποίηση του buffering για να μην "κολλάει" το session
    proxy_buffering off;
}
}

