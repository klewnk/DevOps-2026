server {
    listen 80;
    server_name klewn-devops.duckdns.org;
    return 301 https://$host$request_uri; # Redirect σε HTTPS
}

server {
    listen 443 ssl;
    server_name klewn-devops.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/klewn-devops.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klewn-devops.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

 location /mail/ {
    proxy_pass http://mailhog_container:8025/; 
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade"; 
}

   location /db/ {
    proxy_pass http://adminer_container:8080/;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_cookie_path / /db/;
    
    proxy_buffering off;
}
}

