---
- name: Full Setup and Deploy to MicroK8s
  hosts: devops_gcloud1
  become: yes  # Τρέχουμε τα πάντα ως root (sudo)
  vars:
    ansible_user: kleonkola

  tasks:
    # --- ΒΗΜΑ 1: SETUP ---
    
    - name: Εγκατάσταση MicroK8s
      community.general.snap:
        name: microk8s
        classic: yes
        state: present

    - name: Προσθήκη του χρήστη στο group microk8s
      user:
        name: "{{ ansible_user }}"
        groups: microk8s
        append: yes

    - name: Reset SSH Connection (για να πιάσει το νέο group)
      meta: reset_connection

    - name: Ρύθμιση ιδιοκτησίας του φακέλου .kube
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: microk8s
        mode: '0750'

    - name: Ενεργοποίηση Addons
      command: /snap/bin/microk8s enable dns storage ingress
      register: addons_result
      changed_when: "'enabled' in addons_result.stdout"
      ignore_errors: yes

    - name: Αναμονή μέχρι το MicroK8s να είναι έτοιμο
      command: /snap/bin/microk8s status --wait-ready
      changed_when: false

    # --- ΒΗΜΑ 2: DEPLOYMENT ---

    - name: Δημιουργία φακέλου project στο VM
      file:
        path: "/home/{{ ansible_user }}/kubernetes"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Μεταφορά των K8s manifests στο VM
      copy:
        # Χρησιμοποιούμε το playbook_dir για να βρούμε σίγουρα τα αρχεία
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "/home/{{ ansible_user }}/kubernetes/{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      loop:
        - postgres-k8s.yaml
        - mailhog-k8s.yaml
        - adminer-k8s.yaml
        - app-k8s.yaml
        - ingress-k8s.yaml

    - name: Apply K8s Manifests (ως Root για σιγουριά)
      # Τρέχουμε ως root (become: yes) για να μην έχουμε θέμα permission
      command: /snap/bin/microk8s kubectl apply -f /home/{{ ansible_user }}/kubernetes/{{ item }}
      loop:
        - postgres-k8s.yaml
        - mailhog-k8s.yaml
        - adminer-k8s.yaml
        - app-k8s.yaml
        - ingress-k8s.yaml