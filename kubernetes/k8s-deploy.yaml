---
- name: Deploy Information System to MicroK8s
  hosts: devops_gcloud1
  become: yes
  tasks:
    - name: Δημιουργία φακέλου στο VM
      file:
        path: /home/kleonkola/kubernetes
        state: directory
        owner: kleonkola
        group: kleonkola
        mode: '0755'

    - name: Μεταφορά των K8s manifests στο VM
      copy:
        # Το 'src' δείχνει το path ΣΤΟΝ JENKINS (σχετικό με το playbook)
        # Αν το playbook είναι στο ansible-devops/playbooks/, τότε το ../../kubernetes/ είναι σωστό
        src: "../../kubernetes/"  
        dest: "/home/kleonkola/kubernetes/"
        owner: kleonkola
        group: kleonkola
        mode: '0644'

    - name: Apply K8s Manifests
      # Τώρα που τα αρχεία είναι ΕΚΕΙ, το kubectl μπορεί να τα διαβάσει
      command: "microk8s kubectl apply -f /home/kleonkola/kubernetes/{{ item }}"
      loop:
        - "postgres-k8s.yaml"
        - "mailhog-k8s.yaml"
        - "adminer-k8s.yaml"
        - "app-k8s.yaml"
        - "ingress-k8s.yaml"