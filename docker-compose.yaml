services:
  # 1. ΒΑΣΗ ΔΕΔΟΜΕΝΩΝ
  db:
    image: postgres:15
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=pass123
      - POSTGRES_DB=devops_db
    volumes:
      - pgdata_docker:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. EMAIL SERVER (MailHog)
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_container
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # 3. Η ΕΦΑΡΜΟΓΗ 
  app:
    image: ghcr.io/klewnk/spring-app:latest
    container_name: spring_app_container
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Προσοχή: Εδώ συνδεόμαστε στο "db" και στο "mailhog", όχι στο localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/devops_db
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=pass123
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025

volumes:
  pgdata_docker: