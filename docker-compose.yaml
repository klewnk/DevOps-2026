services:
  db:
    image: postgres:15
    container_name: postgres_container
    restart: always
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=pass123
      - POSTGRES_DB=devops_db
    volumes:
      - pgdata_docker:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d devops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    image: ghcr.io/klewnk/spring-app:latest
    container_name: spring_app_container
    restart: always
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      mailhog: 
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/devops_db
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=pass123
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
    networks:
      - app-network

  web:
    image: nginx:alpine
    container_name: nginx_container
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer_container
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_container
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app-network


  # USER MANAGEMENT (Keycloak) -
  keycloak:
    build:
      context: .
      dockerfile: Keycloak.Dockerfile
    container_name: keycloak_container
    restart: always
    environment:
      - KEYCLOAK_ADMIN=admin       # Username για το Admin Panel
      - KEYCLOAK_ADMIN_PASSWORD=admin # Password για το Admin Panel
      - KC_HOSTNAME_STRICT_HTTPS=false

    ports:
      - "8180:8080" # http://IP:8180
    networks:
      - app-network

volumes:
  pgdata_docker:

networks:
  app-network:
    driver: bridge