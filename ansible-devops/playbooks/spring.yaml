---
- name: Install spring boot application
  hosts: devops_gcloud1
  become: yes

  vars:
    # 1. Φάκελος εφαρμογής
    app_dir: "/opt/project20205"
    
    # 2. Branch
    branch: "main"
    
    # 3. Χρήστης (Χρησιμοποιείται και στο spring.j2)
    app_user: "kleonkola" 

    # 4. Ρυθμίσεις εφαρμογής (Βάση + EMAIL)
    app:
      env:
        "server.port": "8080"
        
        # Database Settings
        "spring.datasource.url": "jdbc:postgresql://localhost:5432/devops_db"
        "spring.datasource.username": "dbuser"
        "spring.datasource.password": "pass123"
        
        # Email Settings 
        "spring.mail.host": "127.0.0.1"
        "spring.mail.port": "1025"
        "spring.mail.username": ""
        "spring.mail.password": ""
        "spring.mail.properties.mail.smtp.auth": "false"
        "spring.mail.properties.mail.smtp.starttls.enable": "false"

  pre_tasks:
    - name: Install java
      apt:
        name: openjdk-21-jdk
        state: present
        update_cache: yes
      tags:
        - install
    
  tasks:
    - name: Install required system utilities
      apt:
        name: psmisc  # εντολή 'fuser'
        state: present
        update_cache: yes

    - name: Stop Spring Boot service if running
      service:
        name: spring
        state: stopped
      ignore_errors: yes

    - name: Force kill anything stuck on port 8080
      shell: "fuser -k 8080/tcp"
      ignore_errors: yes 


    - name: Ensure git is installed
      apt:
        name: git
        state: present
      tags:
        - install

    - name: Clone git repo
      git:
        repo: https://github.com/klewnk/project20205.git
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        accept_hostkey: yes
        force: yes

    - name: Fix permissions for app directory (Before Build)
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes

    - name: Populate application.properties
      lineinfile:
        dest: "{{ app_dir }}/src/main/resources/application.properties"
        state: present
        regexp: "^{{item.key}}="
        line: "{{item.key}}={{item.value}}"
      with_items:
        - "{{app.env | dict2items}}"
      tags:
        - edit

    - name: Build spring project
      block:
        - name: Ensure mvnw is executable
          file:
            path: "{{ app_dir }}/mvnw"
            mode: "0755"
          tags:
            - edit

        - name: Build the Spring application (First Attempt)
          command: "./mvnw package -Dmaven.test.skip"
          args:
            chdir: "{{ app_dir }}"

      rescue:
        - name: Fetch Maven SHA-512 checksum
          get_url:
            url: https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.zip.sha512
            dest: /tmp/maven_sha512.txt
            validate_certs: yes
            force: yes

        - name: Read checksum
          command: cat /tmp/maven_sha512.txt
          register: sha512_checksum

        - name: Update maven-wrapper.properties
          replace:
            path: "{{ app_dir }}/.mvn/wrapper/maven-wrapper.properties"
            regexp: '^distributionSha'
            replace: "distributionSha512Sum={{ sha512_checksum.stdout }}"
          tags:
            - edit
          
        - name: Clean up temp file
          file:
            path: /tmp/maven_sha512.txt
            state: absent
          when: sha512_checksum is defined
          
      always:
          - name: Build the Spring application (Final Attempt)
            command: "./mvnw package -Dmaven.test.skip"
            args:
              chdir: "{{ app_dir }}"

    # πρόσβαση στο .jar
    - name: Fix permissions - Give ownership to app user
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes
        state: directory

    - name: Copy spring service file
      template:
        src: ../services/spring.j2
        dest: "/etc/systemd/system/spring.service"
      notify: Restart spring

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Ensure spring service started
      service:
        name: spring
        state: started
        enabled: yes

    - name: Stop Docker Nginx and kill any process on 80/443
      shell: |
        docker rm -f nginx_container || true
        fuser -k 80/tcp || true
        fuser -k 443/tcp || true
      ignore_errors: yes

    - name: Install nginx
      apt:
        name: nginx
        update_cache: yes
      tags:
        - install

    - name: Copy nginx conf file
      template:
        src: ../services/nginx.j2
        dest: "/etc/nginx/sites-available/reverse_proxy"
      notify: Restart nginx

    - name: Enable my site in nginx
      file:
        src: "/etc/nginx/sites-available/reverse_proxy"
        dest: "/etc/nginx/sites-enabled/reverse_proxy"
        state: link
      notify: Restart nginx

    - name: De-activate default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart nginx

  handlers:
    - name: Restart spring
      service:
        name: spring
        state: restarted

    - name: Restart nginx
      service:
        name: nginx
        state: restarted