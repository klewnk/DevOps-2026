---
- name: Install spring boot application
  hosts: devops_gcloud1
  become: yes

  vars:
    app_dir: "/opt/project20205"
    
    branch: "main"
    
    app_user: "kleonkola" 

    app:
      env:
        "server.port": "8080"
        
        # Database Settings
        "spring.datasource.url": "jdbc:postgresql://localhost:5432/devops_db"
        "spring.datasource.username": "dbuser"
        "spring.datasource.password": "pass123"
        
        # Email Settings 
        "spring.mail.host": "127.0.0.1"
        "spring.mail.port": "1025"
        "spring.mail.username": ""
        "spring.mail.password": ""
        "spring.mail.properties.mail.smtp.auth": "false"
        "spring.mail.properties.mail.smtp.starttls.enable": "false"

  pre_tasks:
    - name: Install java
      apt:
        name: openjdk-21-jdk
        state: present
        update_cache: yes
      tags:
        - install
    
  tasks:
    
    - name: Stop MicroK8s (To free up ports 80/443 from Ingress)
      command: microk8s stop
      ignore_errors: yes

    - name: Stop and Remove ALL Docker Containers
      shell: "docker rm -f $(docker ps -aq) || true"
      ignore_errors: yes

    - name: Force kill everything on project ports (80, 443, 8080, 5432, 8025)
      shell: "fuser -k 80/tcp 443/tcp 8080/tcp 5432/tcp 8025/tcp || true"
      ignore_errors: yes

    - name: Install required system utilities
      apt:
        name: psmisc  
        state: present
        update_cache: yes

    - name: Stop Spring Boot service if running
      service:
        name: spring
        state: stopped
      ignore_errors: yes

    - name: Force kill anything stuck on port 8080
      shell: "fuser -k 8080/tcp"
      ignore_errors: yes 


    - name: Ensure git is installed
      apt:
        name: git
        state: present
      tags:
        - install

    - name: Clone git repo
      git:
        repo: https://github.com/klewnk/project20205.git
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        accept_hostkey: yes
        force: yes

    - name: Fix permissions for app directory (Before Build)
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes

    - name: Populate application.properties
      lineinfile:
        dest: "{{ app_dir }}/src/main/resources/application.properties"
        state: present
        regexp: "^{{item.key}}="
        line: "{{item.key}}={{item.value}}"
      with_items:
        - "{{app.env | dict2items}}"
      tags:
        - edit

    - name: Build spring project
      block:
        - name: Ensure mvnw is executable
          file:
            path: "{{ app_dir }}/mvnw"
            mode: "0755"
          tags:
            - edit

        - name: Build the Spring application (First Attempt)
          command: "./mvnw package -Dmaven.test.skip"
          args:
            chdir: "{{ app_dir }}"

      rescue:
        - name: Fetch Maven SHA-512 checksum
          get_url:
            url: https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.zip.sha512
            dest: /tmp/maven_sha512.txt
            validate_certs: yes
            force: yes

        - name: Read checksum
          command: cat /tmp/maven_sha512.txt
          register: sha512_checksum

        - name: Update maven-wrapper.properties
          replace:
            path: "{{ app_dir }}/.mvn/wrapper/maven-wrapper.properties"
            regexp: '^distributionSha'
            replace: "distributionSha512Sum={{ sha512_checksum.stdout }}"
          tags:
            - edit
          
        - name: Clean up temp file
          file:
            path: /tmp/maven_sha512.txt
            state: absent
          when: sha512_checksum is defined
          
      always:
          - name: Build the Spring application (Final Attempt)
            command: "./mvnw package -Dmaven.test.skip"
            args:
              chdir: "{{ app_dir }}"

    - name: Fix permissions - Give ownership to app user
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes
        state: directory

    - name: Copy spring service file
      template:
        src: ../services/spring.j2
        dest: "/etc/systemd/system/spring.service"
      notify: Restart spring

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: 1. Force Restart Native Postgres
      service:
        name: postgresql
        state: restarted  # Επιβάλλουμε φρεσκάρισμα
        enabled: yes

    - name: 1b. Wait for Postgres to actually be ready
      wait_for:
        port: 5432
        host: 127.0.0.1   # Χρήση IP για σιγουριά
        delay: 5          # Δώσε 5 δευτερόλεπτα αβάντζα
        timeout: 45       # Δώσε της περισσότερο χρόνο να "συνέλθει" 

    - name: 2. Start Spring Application
      service:
        name: spring
        state: restarted
        enabled: yes

    - name: Cleanup Docker and Ports before Native Nginx
      shell: |
        docker rm -f nginx_container || true
        fuser -k 80/tcp || true
        fuser -k 443/tcp || true
      ignore_errors: yes

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Copy nginx conf file
      template:
        src: ../services/nginx.j2
        dest: "/etc/nginx/sites-available/reverse_proxy"

    - name: Enable and Clean Nginx Config
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Link Reverse Proxy
      file:
        src: "/etc/nginx/sites-available/reverse_proxy"
        dest: "/etc/nginx/sites-enabled/reverse_proxy"
        state: link

    - name: FORCE START NGINX
      service:
        name: nginx
        state: restarted 
        enabled: yes
        

  handlers:
    - name: Restart spring
      service:
        name: spring
        state: restarted

    - name: Restart nginx
      service:
        name: nginx
        state: restarted