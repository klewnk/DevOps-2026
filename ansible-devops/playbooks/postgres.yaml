---
- name: Install and Setup PostgreSQL (Native VM Scenario)
  hosts: all
  become: yes
  vars:
    # Τα στοιχεία πρέπει να ταιριάζουν με το application.properties του Spring
    db_name: "devops_db"
    db_user: "dbuser"
    db_password: "pass123"
    postgres_version: "14" # Ή 15/16, το Ansible θα βρει το σωστό path με το *

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install PostgreSQL and dependencies
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2  # Απαραίτητο για να διαχειριστεί το Ansible τη βάση
          - acl
        state: present

    - name: Ensure PostgreSQL service is started and enabled
      service:
        name: postgresql
        state: started
        enabled: yes

    # --- ΡΥΘΜΙΣΗ ΧΡΗΣΤΩΝ & ΒΑΣΗΣ ---
    
    - name: Create database user 'dbuser' with password
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        role_attr_flags: CREATEDB,NOSUPERUSER
      become: yes
      become_user: postgres

    - name: Create database 'devops_db'
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      become: yes
      become_user: postgres

    # --- ΡΥΘΜΙΣΗ ΠΡΟΣΒΑΣΗΣ (Fix Connection Refused / Password Fail) ---

    - name: Allow md5 password authentication for localhost
      # Αυτό επιτρέπει στο Spring Boot (που τρέχει στο ίδιο VM) να συνδεθεί με κωδικό
      community.postgresql.postgresql_pg_hba:
        dest: "/etc/postgresql/*/main/pg_hba.conf" 
        contype: host
        users: all
        source: 127.0.0.1/32
        method: md5 # Σημαντικό: MD5 ή SCRAM-SHA-256 για να δέχεται κωδικό
        databases: all
      become: yes
      become_user: postgres
      notify: Restart Postgres

  handlers:
    - name: Restart Postgres
      service:
        name: postgresql
        state: restarted