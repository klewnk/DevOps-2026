- name: Install Adminer Native (No Docker)
  hosts: devops_gcloud1
  become: yes

  tasks:
    - name: Install PHP and Postgres Driver
      apt:
        name:
          - php-fpm
          - php-pgsql
        state: present
        update_cache: yes

    - name: Create Web Directory for Adminer
      file:
        path: /var/www/adminer
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Download Adminer PHP script
      get_url:
        url: https://www.adminer.org/latest.php
        dest: /var/www/adminer/index.php
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Stop and Cleanup old Docker Adminer
      shell: |
        docker rm -f db_adminer || true
        fuser -k 8081/tcp || true
      ignore_errors: yes