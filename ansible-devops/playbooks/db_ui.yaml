- name: Install Adminer (Database UI)
  hosts: devops_gcloud1
  become: yes

  tasks:
    - name: Ensure Docker and psmisc are installed
      apt:
        name: 
          - docker.io
          - psmisc 
        state: present
        update_cache: yes

    # Πρώτα καθαρίζουμε τυχόν container που "κλειδώνει" την πόρτα
    - name: Remove any container using port 8081
      shell: "docker rm -f $(docker ps -q --filter 'publish=8081') || true"

    # Μετά σκοτώνουμε οποιαδήποτε άλλη "ορφανή" διεργασία στην 8081
    - name: Force kill anything on port 8081
      shell: "fuser -k 8081/tcp || true"

    # Αφαίρεση του Adminer container
    - name: Remove old Adminer container by name
      docker_container:
        name: db_adminer
        state: absent
        force_kill: yes

    # Εκκίνηση του νέου Adminer
    - name: Run Adminer container
      docker_container:
        name: db_adminer
        image: adminer
        state: started
        restart_policy: always
        published_ports:
          - "8081:8080"