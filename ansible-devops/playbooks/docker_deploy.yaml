---
- name: Install spring boot application and all the other components in docker environment
  hosts: devops_gcloud1
  become: yes
  
  # ΕΔΩ ΠΡΟΣΘΕΣΑΜΕ ΤΙΣ ΜΕΤΑΒΛΗΤΕΣ ΠΟΥ ΕΛΕΙΠΑΝ
  vars:
    repo_dir: "/home/{{ ansible_user_id }}/DevOps-2026"  # Πού θα κατέβει το repo
    app_dir: "/home/{{ ansible_user_id }}/DevOps-2026"   # Πού είναι το app (συνήθως το ίδιο)
    branch: "main"                                       # Ποιο branch να κατεβάσει
    # Ορίζουμε και κενές μεταβλητές για το app env για να μην σκάσει παρακάτω
    app:
      env:
        SERVER_PORT: "8080" # Παράδειγμα, μπορείς να βάλεις ό,τι θες ή να το αφήσεις κενό

  tasks:
    - name: Ensure Docker is available
      shell: docker --version && docker compose version
      register: docker_version_result
      ignore_errors: true
      changed_when: false

    - name: Set Docker installed fact
      set_fact:
        docker_installed: "{{ docker_version_result.rc == 0 }}"

    - name: Include install_docker playbook if Docker is not installed
      include_tasks: docker.yaml
      when: not docker_installed

    - name: Clone git repo
      git:
        # ΕΔΩ ΔΙΟΡΘΩΣΑΜΕ ΤΟ URL ΣΕ DevOps-2026
        repo: https://github.com/klewnk/DevOps-2026.git
        dest: "{{ repo_dir }}"
        version: "{{ branch }}"
        force: yes
        accept_hostkey: yes
        recursive: yes
        update: yes

    - name: Decrypt SSL cert
      copy:
        src: ../../assets/certs/mydomain.crt.encrypted
        dest: "{{ repo_dir }}/assets/certs/mydomain.crt"
        decrypt: yes
        owner: root
        mode: '0644'
      # Βάζουμε ignore_errors μήπως δεν έχεις ανεβάσει ακόμα τα encrypted files
      ignore_errors: yes 

    - name: Decrypt private key
      copy:
        src: ../../assets/certs/private.key.encrypted
        dest: "{{ repo_dir }}/assets/certs/private.key"
        decrypt: yes
        owner: root
        mode: '0600'
      ignore_errors: yes
      
    - name: Clean up encrypted certs
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ repo_dir }}/assets/certs/mydomain.crt.encrypted"
        - "{{ repo_dir }}/assets/certs/private.key.encrypted"
      ignore_errors: yes

    - name: "Populate application.properties"
      lineinfile:
        dest: "{{ app_dir }}/src/main/resources/application.properties"
        state: present
        regexp: "^{{item.key}}="
        line: "{{item.key}}={{item.value}}"
      with_items:
        - "{{app.env | dict2items}}"
      tags:
        - edit
      # Αγνοούμε σφάλματα αν δεν υπάρχει το αρχείο application.properties ακόμα
      ignore_errors: yes

    - name: Install pip3 
      apt:
        name: python3-pip
        state: latest
        update_cache: yes
      tags:
        - install

    - name: Install Docker SDK for Python
      command: pip3 install docker --break-system-packages
      tags:
        - install

    - name: Free up all the ports from previous runs
      script: "../files/stop_services.sh"
      ignore_errors: yes

    - name: Check if any containers are running
      command: docker ps -q
      register: running_containers
      changed_when: false
      failed_when: false
      tags:
        - stop

    - name: Stop any existing containers
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        state: absent
      when: running_containers.stdout != ""
      tags:
        - stop
    
    - name: Start the containers
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        build: always
        state: present
      register: output
      notify: Restart Docker Compose
      tags:
        - start
    
    - debug:
        var: output
  
  handlers:
    - name: Restart Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        state: restarteds