- name: Managed Docker Deployment
  hosts: devops_gcloud1
  become: yes
  vars:
    repo_dir: "/home/{{ ansible_user_id }}/DevOps-2026"
    app_dir: "/home/{{ ansible_user_id }}/DevOps-2026"
    app:
      env:
        SERVER_PORT: "8080"

  tasks:
    # --- ΦΑΣΗ 1: INFRASTRUCTURE (Tags: install) ---
    
    - name: Check if Docker is installed
      shell: docker --version
      register: docker_check
      ignore_errors: yes
      tags: install

    - name: Include Docker Installation Tasks
      include_tasks: docker.yaml
      when: docker_check.rc != 0
      tags: install

    - name: Install Python Pip and SDK
      apt:
        name: python3-pip
        state: present
      tags: install

    - name: Install Docker library for Python
      command: pip3 install docker --break-system-packages
      tags: install

    # --- ΦΑΣΗ 2: DEPLOYMENT (Tags: deploy) ---

    - name: Clone source code from GitHub
      git:
        repo: https://github.com/klewnk/DevOps-2026.git
        dest: "{{ repo_dir }}"
        version: main
        force: yes
      tags: deploy

    - name: Update Application Properties
      lineinfile:
        dest: "{{ repo_dir }}/src/main/resources/application.properties"
        state: present
        regexp: "^{{item.key}}="
        line: "{{item.key}}={{item.value}}"
      with_items:
        - { key: 'server.port', value: '8080' }
        - { key: 'spring.datasource.url', value: 'jdbc:postgresql://db:5432/devops_db' }
      tags: deploy

    - name: Kill any process on database port (Safety)
      shell: "fuser -k 5432/tcp || true"
      tags: deploy

    - name: Deploy Containers with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        state: present
        build: always
      register: output
      tags: deploy

    - debug:
        var: output
      tags: deploy