- name: Install spring boot application in docker environment
  hosts: all
  become: yes
  vars:
    repo_dir: "/home/kleonkola/DevOps-2026"

  tasks:
    # --- ΠΡΟΕΤΟΙΜΑΣΙΑ & ΚΑΘΑΡΙΣΜΟΣ ---
    
    - name: Install psmisc (fuser)
      apt:
        name: psmisc
        state: present

    - name: Stop native services (Postgres, Mailhog, Nginx)
      service:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - postgresql
        - mailhog
        - nginx 
      ignore_errors: yes

    - name: Remove specific conflicting container (db_adminer)
      shell: "docker stop db_adminer || true && docker rm db_adminer || true"

    - name: Force kill anything on our app ports
      # Προσθέσαμε την 80/tcp εδώ
      shell: "fuser -k 80/tcp 5432/tcp 8081/tcp 8025/tcp 1025/tcp || true"
      ignore_errors: yes

    # --- ΕΝΗΜΕΡΩΣΗ ΚΩΔΙΚΑ & REGISTRY ---

    - name: Clone or Update git repo
      git:
        repo: https://github.com/klewnk/DevOps-2026.git
        dest: "{{ repo_dir }}"
        version: main
        force: yes

    - name: Log into GitHub Container Registry
      docker_login:
        registry: ghcr.io
        username: klewnk
        password: "{{ lookup('env', 'DOCKER_TOKEN') }}"
      ignore_errors: yes

    # --- DEPLOYMENT ---

    - name: Stop/Remove existing containers from this compose project
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        state: absent

    - name: Final Start of the containers
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        state: present
        pull: always