---
- name: Install spring boot application in docker environment
  hosts: all
  become: yes
  vars:
    repo_dir: "/home/kleonkola/DevOps-2026" # Χρησιμοποιούμε το απόλυτο path σου

  tasks:
    - name: Clone git repo
      git:
        repo: https://github.com/klewnk/DevOps-2026.git
        dest: "{{ repo_dir }}"
        version: main
        force: yes
        recursive: no
        update: yes

    # ΠΡΟΣΘΗΚΗ: Login για να μπορεί να κατεβάσει το image
    - name: Log into GitHub Container Registry
      docker_login:
        registry: ghcr.io
        username: klewnk
        password: "{{ lookup('env', 'DOCKER_TOKEN') }}" 
      ignore_errors: yes

    - name: Stop any existing containers
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        state: absent

    - name: Start the containers
      community.docker.docker_compose_v2:
        project_src: "{{ repo_dir }}"
        state: present
        pull: always
        build: always